<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Cipresso Group — Commercial Real Estate Data &amp; Research</title>
  <meta name="description" content="Cipresso Group delivers institutional commercial real estate data and research for owners, lenders, and allocators." />
  <meta property="og:title" content="Cipresso Group" />
  <meta property="og:description" content="Institutional commercial real estate data &amp; research." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='40' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { future: { hoverOnlyWhenSupported: true }, theme: { extend: { fontFamily: { serif: ['"Cormorant Garamond"', 'Georgia', 'serif'], sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }, colors: { ink: '#0a0a0a' } } } };
  </script>
  <link rel="stylesheet" href="assets/site.css?v=10" />
</head>

<body class="relative isolate flex min-h-svh flex-col bg-white font-sans text-ink">

  <!-- Live "data terrain" background, drawn by assets/data-field.js -->
  <canvas id="data-field" class="fixed inset-0 -z-10 h-full w-full" aria-hidden="true"></canvas>

  <main class="flex flex-1 items-center justify-center overflow-x-clip px-4 py-10">
    <h1 class="logo logo-xl haze">
      <span class="logo-main">CIPRESSO</span>
      <span class="logo-sub">GROUP</span>
    </h1>
  </main>

  <footer class="safe-bottom overflow-x-clip px-4 pt-1 text-center">
    <div class="haze haze-sm inline-block">
      <nav aria-label="Primary">
        <!-- Padded links give a comfortable tap target on phones -->
        <ul class="label flex justify-center gap-1 text-[11px] tracking-[0.16em] sm:gap-6 sm:text-[12px] sm:tracking-[0.18em]">
          <li><a href="about.html" class="nav-link inline-block px-2.5 py-4 text-neutral-800 sm:px-3">About</a></li>
          <li><a href="research.html" class="nav-link inline-block px-2.5 py-4 text-neutral-800 sm:px-3">Research</a></li>
          <li><a href="contact.html" class="nav-link inline-block px-2.5 py-4 text-neutral-800 sm:px-3">Contact</a></li>
        </ul>
      </nav>
      <p class="text-[11px] text-neutral-600 sm:text-[12px]">&copy; <span id="year">2026</span> Cipresso Group, LLC<span class="max-[360px]:hidden"> &nbsp;·&nbsp; </span><span class="max-[360px]:block">Research purposes only.</span></p>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="assets/data-field.js?v=9"></script>
</body>
</html>
