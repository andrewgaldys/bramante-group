<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bramante Group — Commercial Real Estate Data &amp; Research</title>
  <meta name="description" content="Bramante Group delivers institutional commercial real estate data and research for owners, lenders, and allocators." />
  <meta property="og:title" content="Bramante Group" />
  <meta property="og:description" content="Institutional commercial real estate data &amp; research." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='40' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { serif: ['"Cormorant Garamond"', 'Georgia', 'serif'], sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }, colors: { ink: '#0a0a0a' } } } };
  </script>
  <link rel="stylesheet" href="assets/site.css" />
</head>

<body class="relative isolate flex min-h-svh flex-col bg-white font-sans text-ink">

  <!-- Live "data terrain" background, drawn by assets/data-field.js -->
  <canvas id="data-field" class="fixed inset-0 -z-10 h-full w-full" aria-hidden="true"></canvas>

  <header class="glass-bar border-b">
    <!-- pr-3 offsets the 12px left rail so the logo sits on the true center of the screen -->
    <div class="flex h-20 items-center justify-center pr-3 sm:h-24">
      <a href="index.html" class="logo" aria-label="Bramante Group — Home">
        <span class="logo-main">BRAMANTE</span>
        <span class="logo-sub">GROUP</span>
      </a>
    </div>
  </header>

  <main class="flex flex-1 items-end px-4 py-4 sm:px-6 sm:py-6 lg:items-center lg:px-10">
    <section class="glass w-full max-w-[600px] p-6 sm:p-10 lg:max-w-[560px] xl:max-w-[620px] xl:p-14">
      <p class="label text-neutral-600">Data &amp; Research</p>
      <h1 class="mt-6 font-serif text-[2.3rem] font-medium leading-[1.05] sm:mt-8 sm:text-[3.25rem] lg:text-[clamp(2.75rem,6.2vh,4.25rem)]">
        Institutional Commercial Real Estate Data &amp; Research
      </h1>
      <p class="mt-5 max-w-md text-[16px] leading-7 text-neutral-700 sm:text-[17px]">
        Data-driven market intelligence for owners, lenders, and allocators of commercial real estate.
      </p>
      <nav aria-label="Primary" class="-mx-6 -mb-6 mt-8 grid grid-cols-3 border-t border-black/10 sm:-mx-10 sm:-mb-10 sm:mt-10 xl:-mx-14 xl:-mb-14 xl:mt-12">
        <a href="about.html" class="page-link">About <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg></a>
        <a href="research.html" class="page-link border-l border-black/10">Research <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg></a>
        <a href="contact.html" class="page-link border-l border-black/10">Contact <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg></a>
      </nav>
    </section>
  </main>

  <footer class="glass-bar border-t px-4 py-4 pr-7 text-center text-[11px] text-neutral-700 sm:text-[12px] lg:py-4">
    <p class="glass-chip">&copy; <span id="year">2026</span> Bramante Group, LLC &nbsp;·&nbsp; Research purposes only.</p>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="assets/data-field.js"></script>
</body>
</html>
